<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PyCamp — бесплатный интерактивный курс Python в браузере: теория, практика с автопроверкой, настоящий Python через Pyodide.">
<title>PyCamp — интерактивный курс Python</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0c1017; --bg-soft:#11161f; --panel:#151c26; --panel-2:#1b2532;
  --border:#26334a; --border-soft:#1d2736;
  --text:#e8eef6; --muted:#93a1b3; --dim:#66758a;
  --green:#3fdc85; --green-deep:#0f2f20;
  --yellow:#ffd343; --blue:#58a6ff; --red:#ff6b6b; --purple:#d2a8ff; --orange:#ffa657;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","Fira Code",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  --radius:14px;
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(88,166,255,.09), transparent 60%),
    radial-gradient(900px 520px at -10% 25%, rgba(63,220,133,.07), transparent 55%),
    var(--bg);
  color:var(--text); font-family:var(--sans); min-height:100vh;
}
::selection{background:rgba(88,166,255,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b3850;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--blue)}
noscript{display:block;padding:40px;text-align:center;color:var(--muted)}

/* ---------- Топбар ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:10px 20px;
  background:rgba(12,16,23,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft)}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--text);text-decoration:none;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--green)}
.top-progress{flex:1;display:flex;align-items:center;gap:10px;max-width:460px;margin:0 auto;min-width:120px}
.tp-bar{flex:1;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.tp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));width:0;transition:width .5s}
.tp-label{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:12px}
.py-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;flex-shrink:0}
.py-status.loading .dot{background:var(--yellow);animation:pulse 1s infinite}
.py-status.ok .dot{background:var(--green);box-shadow:0 0 8px rgba(63,220,133,.7)}
.py-status.err .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{background:var(--panel);border:1px solid var(--border-soft);color:var(--muted);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--border)}

/* ---------- Кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;
  padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text);
  font-family:var(--sans);transition:.15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-primary{background:linear-gradient(135deg,#2ea367,#1d8a53);color:#fff;box-shadow:0 4px 18px rgba(46,163,103,.25)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--panel);border-color:var(--border-soft);color:var(--text)}
.btn-ghost:hover{border-color:var(--border);background:var(--panel-2)}
.btn.big{padding:13px 26px;font-size:15px;border-radius:12px}
.btn-run{background:#152c4d;color:var(--blue);border:1px solid #27497a}
.btn-run:hover{filter:brightness(1.25)}
.btn-check{background:var(--green-deep);color:var(--green);border:1px solid #1e5c3c}
.btn-check:hover{filter:brightness(1.3)}
.btn-reset{background:transparent;border:1px solid var(--border-soft);color:var(--dim)}
.btn-reset:hover{color:var(--text);border-color:var(--border)}

/* ---------- Главная ---------- */
.hero{max-width:920px;margin:44px auto 30px;padding:0 22px;text-align:center}
.hero-badge{display:inline-block;background:var(--panel);border:1px solid var(--border-soft);color:var(--muted);
  font-size:12.5px;padding:7px 16px;border-radius:99px;letter-spacing:.3px}
.hero h1{font-size:46px;margin:18px 0 14px;line-height:1.12;letter-spacing:-.5px}
.grad{background:linear-gradient(90deg,var(--blue),var(--green) 55%,var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:16.5px;line-height:1.7;max-width:660px;margin:0 auto 24px}
.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:14px 26px;min-width:130px}
.stat-num{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.modules{display:grid;gap:12px;max-width:920px;margin:0 auto 30px;padding:0 22px}
.modules-h{max-width:920px;margin:8px auto 4px;padding:0 22px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.module{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;transition:border-color .15s}
.module:hover{border-color:var(--border)}
.module-head{width:100%;display:flex;align-items:center;gap:14px;padding:15px 18px;background:none;border:0;color:var(--text);cursor:pointer;text-align:left;font-family:var(--sans)}
.m-icon{font-size:22px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border-radius:12px;flex-shrink:0}
.m-info{flex:1;min-width:0}
.m-title{font-weight:700;font-size:15.5px;display:block}
.m-meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:block}
.m-bar{width:86px;height:5px;border-radius:99px;background:var(--panel-2);overflow:hidden;flex-shrink:0}
.m-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));width:0;transition:width .4s}
.m-pct{font-size:12px;color:var(--muted);width:38px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.chev{color:var(--dim);transition:transform .2s;font-size:13px;flex-shrink:0}
.module.open .chev{transform:rotate(180deg)}
.module-lessons{display:none;border-top:1px solid var(--border-soft)}
.module.open .module-lessons{display:block}
.lesson-row{display:flex;align-items:center;gap:12px;padding:11px 18px 11px 22px;border-top:1px solid var(--border-soft);cursor:pointer;color:var(--text);text-decoration:none;font-size:14px;transition:background .1s}
.lesson-row:first-child{border-top:0}
.lesson-row:hover{background:var(--bg-soft)}
.lesson-row.active{background:rgba(88,166,255,.08)}
.l-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex-shrink:0;transition:.15s}
.lesson-row.done .l-check{background:var(--green);border-color:var(--green);color:#06130b}
.l-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-badge{flex-shrink:0}
.badge{font-size:10px;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.badge-theory{background:rgba(88,166,255,.14);color:var(--blue)}
.badge-challenge{background:rgba(63,220,133,.13);color:var(--green)}
.l-arrow{color:var(--dim);font-size:14px;flex-shrink:0}
.footer{max-width:920px;margin:10px auto 46px;padding:0 22px;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.8}

/* ---------- Урок ---------- */
.lesson{max-width:1500px;margin:0 auto;padding:16px 18px 28px}
.lesson-grid{display:grid;grid-template-columns:minmax(360px,450px) minmax(0,1fr);gap:16px;align-items:start}
.pane-inst{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:22px 24px 18px;max-height:calc(100vh - 92px);overflow:auto;position:sticky;top:60px}
.pane-editor{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 92px);position:sticky;top:60px}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:12.5px;text-decoration:none}
.crumb:hover{color:var(--text)}
.chip{background:var(--panel-2);border:1px solid var(--border-soft);color:var(--muted);font-size:11.5px;padding:3px 10px;border-radius:99px}
.lesson-title{margin:0 0 4px;font-size:22px;line-height:1.25}
.inst-body{margin-top:12px}
.tb h3{margin:22px 0 8px;font-size:16.5px}
.tb p{margin:10px 0;line-height:1.72;color:#c9d4e0;font-size:14.5px}
.tb ul,.tb ol{margin:8px 0;padding-left:22px;color:#c9d4e0;line-height:1.7;font-size:14.5px}
.tb li{margin:5px 0}
.tb li::marker{color:var(--dim)}
.inst-body code{background:#0d1420;border:1px solid var(--border-soft);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:12.6px;color:var(--yellow);white-space:nowrap}
.code-block{background:#0a0e14;border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:12px 0}
.code-block code{font-family:var(--mono);font-size:12.8px;line-height:1.66;color:var(--text);background:none;border:0;padding:0;white-space:pre;display:block}
.callout{border-radius:11px;padding:12px 15px;margin:14px 0;font-size:13.5px;line-height:1.65;color:#c9d4e0}
.callout b{color:var(--text)}
.callout-tip{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.3)}
.callout-warn{background:rgba(255,211,67,.07);border:1px solid rgba(255,211,67,.25)}
.task-box{background:rgba(63,220,133,.06);border:1px solid rgba(63,220,133,.32);border-radius:12px;padding:14px 17px;margin:18px 0 14px}
.task-box h4{margin:0 0 9px;color:var(--green);font-size:12.5px;text-transform:uppercase;letter-spacing:1px}
.task-box p{margin:8px 0}
.task-box ol,.task-box ul{margin:6px 0;padding-left:20px;color:#c9d4e0;line-height:1.7;font-size:14px}
.task-box code{background:#0d1420;border:1px solid var(--border-soft);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:12.6px;color:var(--yellow)}
details.hints,details.sol{margin:12px 0;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-soft)}
details summary{cursor:pointer;padding:11px 15px;color:var(--muted);font-size:13.5px;list-style:none;user-select:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--dim)}
details[open] summary::before{content:"▾ "}
.hint-body{padding:0 15px 12px;font-size:13.5px;color:#c9d4e0;line-height:1.65}
.hint-body + .hint-body{padding-top:8px;border-top:1px dashed var(--border-soft);margin-top:4px}
.sol-code{background:#0a0e14;border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;margin:4px 15px 14px;overflow-x:auto}
.sol-code code{font-family:var(--mono);font-size:12.8px;line-height:1.66;color:var(--text);white-space:pre;display:block}
.sol-insert{margin:0 15px 14px}
.inst-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border-soft)}
.done-note{margin-top:14px;font-size:13px;color:var(--green);display:flex;align-items:center;gap:8px}

/* ---------- Редактор ---------- */
.ed-toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft);background:var(--bg-soft);flex-wrap:wrap}
.ed-file{display:flex;align-items:center;gap:8px;font:12.5px var(--mono);color:var(--muted);margin-right:auto}
.ed-file i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--yellow));display:inline-block}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.code-editor{flex:1;display:flex;min-height:0;background:#0a0e14;position:relative}
.code-editor:focus-within{box-shadow:inset 0 0 0 1px rgba(88,166,255,.25)}
.gutter{padding:14px 10px 14px 14px;text-align:right;color:#39465c;font:13.5px/1.65 var(--mono);user-select:none;overflow:hidden;background:#0a0e14;min-width:46px;white-space:pre;flex-shrink:0}
.editor-wrap{position:relative;flex:1;min-width:0;overflow:hidden}
.editor-wrap pre.hl,.editor-wrap textarea{position:absolute;inset:0;margin:0;padding:14px 16px;font:13.5px/1.65 var(--mono);white-space:pre;overflow:auto;tab-size:4;-moz-tab-size:4;border:0;resize:none;background:transparent}
pre.hl{color:var(--text);pointer-events:none;z-index:1}
pre.hl code{font:inherit;display:block}
.console-pane{display:none}
.console-pane.active{display:block}
textarea.ed-text{z-index:2;color:transparent;caret-color:#fff;outline:0;-webkit-text-fill-color:transparent}
textarea.ed-text::selection{background:rgba(88,166,255,.28);color:transparent}
.tok-k{color:#ff7b72}.tok-s{color:#a5d6ff}.tok-c{color:#7d8896;font-style:italic}
.tok-n{color:#79c0ff}.tok-f{color:#d2a8ff}.tok-b{color:#ffa657}

/* ---------- Консоль ---------- */
.console{height:225px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;flex-shrink:0;background:var(--bg-soft)}
.console-head{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--border-soft)}
.ctab{background:none;border:0;color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
.ctab.active{background:var(--panel-2);color:var(--text)}
.ctab .cnt{font-size:10.5px;background:var(--panel-2);border-radius:99px;padding:1px 7px;margin-left:5px;color:var(--dim)}
.ctab.active .cnt{background:#0d1420}
.console-clear{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:12px;padding:6px 8px}
.console-clear:hover{color:var(--text)}
.console-body{flex:1;overflow:auto}
.placeholder{padding:16px;color:var(--dim);font-size:13px}
.out{margin:0;padding:12px 15px;font:12.8px/1.62 var(--mono);color:#d7e2ee;white-space:pre-wrap;word-break:break-word}
.err-line{padding:12px 15px;color:var(--red);font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.test-row{display:flex;gap:10px;padding:10px 15px;border-bottom:1px dashed var(--border-soft);font-size:13.5px;align-items:flex-start}
.test-row .t-icon{flex-shrink:0;font-size:14px;line-height:1.4}
.t-name{color:#c9d4e0}
.t-msg{display:block;color:var(--red);font-family:var(--mono);font-size:12px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.test-row.pass .t-name{color:#c9d4e0}
.success-banner{margin:12px 15px;padding:13px 16px;border-radius:11px;background:linear-gradient(90deg,rgba(63,220,133,.16),rgba(255,211,67,.08));border:1px solid rgba(63,220,133,.45);color:var(--green);font-weight:700;font-size:14px}

/* ---------- Мобильные табы ---------- */
.mobile-tabs{display:none;gap:8px;margin-bottom:12px}
.mobile-tabs button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--border-soft);background:var(--panel);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.mobile-tabs button.active{color:var(--text);border-color:var(--border);background:var(--panel-2)}

/* ---------- Сертификат ---------- */
.cert-wrap{max-width:760px;margin:36px auto 60px;padding:0 22px}
.cert{border:2px solid var(--yellow);border-radius:20px;background:linear-gradient(165deg,#151d2b,#0d121b);padding:48px 42px;text-align:center;box-shadow:0 0 80px rgba(255,211,67,.08);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,211,67,.25);border-radius:13px;pointer-events:none}
.cert-logo{font-size:44px}
.cert-brand{color:var(--yellow);font-weight:800;letter-spacing:3px;font-size:14px;margin:10px 0 20px;text-transform:uppercase}
.cert h2{margin:0 0 6px;font-size:30px}
.cert .cert-sub{color:var(--muted);font-size:14px;margin:14px 0 6px}
.cert-name{font-size:26px;font-weight:800;min-width:280px;background:transparent;border:0;border-bottom:1px dashed var(--border);color:var(--green);text-align:center;padding:6px 10px;font-family:var(--sans);outline:none}
.cert-name:focus{border-bottom-color:var(--green)}
.cert-course{font-size:19px;font-weight:700;margin:10px 0 4px}
.cert-meta{color:var(--muted);font-size:13px;margin-top:14px;line-height:1.9}
.cert-date{margin-top:22px;color:var(--muted);font-size:13px}
.cert-lock{text-align:center;padding:60px 20px}
.cert-lock .big-ico{font-size:52px}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}

/* ---------- Тост и конфетти ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);background:#0d1420;border:1px solid var(--border);color:var(--text);padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transition:.3s;z-index:300;box-shadow:0 12px 34px rgba(0,0,0,.55);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-26px;width:9px;height:15px;border-radius:2px;z-index:999;pointer-events:none;animation:conf-fall linear forwards}
@keyframes conf-fall{to{transform:translateY(115vh) rotate(660deg);opacity:.85}}

/* ---------- Адаптив ---------- */
@media(max-width:960px){
  .lesson-grid{grid-template-columns:1fr}
  .pane-inst,.pane-editor{position:static;max-height:none;height:auto}
  .pane-editor{height:74vh;min-height:430px}
  .mobile-tabs{display:flex}
  .lesson.show-editor .pane-inst{display:none}
  .lesson:not(.show-editor) .pane-editor{display:none}
  .top-progress{margin:0;max-width:none}
  .py-label-txt{display:none}
  .hero h1{font-size:33px}
  .hero{margin-top:26px}
  .m-bar{display:none}
  .inst-nav{position:sticky;bottom:0;background:var(--panel);padding:12px 0 2px}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">🐍 <span>Py<b>Camp</b></span></a>
  <div class="top-progress" title="Общий прогресс по курсу">
    <div class="tp-bar"><div class="tp-fill" id="tpFill"></div></div>
    <span class="tp-label" id="tpLabel">0 / 0</span>
  </div>
  <div class="top-right">
    <span class="py-status" id="pyStatus"><i class="dot"></i><span class="py-label py-label-txt">Python</span></span>
    <button class="icon-btn" id="resetAll" title="Сбросить весь прогресс">↺</button>
  </div>
</header>
<main id="app"><noscript>Для работы PyCamp нужен включённый JavaScript.</noscript></main>
<script>
'use strict';
/* ================= PyCamp — ядро ================= */

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- Подсветка Python ---------- */
const PY_KEYWORDS = new Set(('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case').split(' '));
const PY_BUILTINS = new Set(('print len range int float str bool list dict set tuple type isinstance input sum min max sorted reversed enumerate zip map filter abs round any all open super id dir help getattr setattr hasattr next iter repr format divmod pow hash hex bin oct ord chr staticmethod classmethod property object bytearray frozenset slice vars exec eval compile globals locals __import__').split(' '));

function highlightPython(src){
  const esc = escapeHtml;
  let out = '', last = 0, m;
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?''')|([rbuRBUfF]{0,2}"(?:\\.|[^"\\\n])*"|[rbuRBUfF]{0,2}'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?[jJ]?\b)|([A-Za-z_]\w*)/g;
  while ((m = re.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    if (m[1]){ out += '<span class="tok-c">' + esc(m[1]) + '</span>'; }
    else if (m[2] || m[3]){ out += '<span class="tok-s">' + esc(m[2] || m[3]) + '</span>'; }
    else if (m[4]){ out += '<span class="tok-n">' + esc(m[4]) + '</span>'; }
    else {
      const w = m[5];
      const before = src.slice(Math.max(0, m.index - 8), m.index);
      let cls = null;
      if (PY_KEYWORDS.has(w)) cls = 'tok-k';
      else if (/(def|class)\s+$/.test(before)) cls = 'tok-f';
      else if (PY_BUILTINS.has(w)) cls = 'tok-b';
      out += cls ? '<span class="' + cls + '">' + esc(w) + '</span>' : esc(w);
    }
    last = re.lastIndex;
  }
  out += esc(src.slice(last));
  return out;
}

const STORAGE_KEY = 'pycamp_v1';
const DEFAULT_STATE = { completed: [], drafts: {}, name: '' };
let state = loadState();

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      return { completed: s.completed || [], drafts: s.drafts || {}, name: s.name || '' };
    }
  } catch(e){}
  return { completed: [], drafts: {}, name: '' };
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function isDone(id){ return state.completed.indexOf(id) !== -1; }
function markDone(id){
  if (!isDone(id)){ state.completed.push(id); saveState(); updateTopbar(); }
}

const COURSE = [];
function addModule(mod){
  mod.lessons.forEach((l, i) => { l.id = mod.id + '-l' + (i + 1); l.module = mod; });
  COURSE.push(mod);
}
function flatLessons(){
  const arr = [];
  COURSE.forEach(m => m.lessons.forEach(l => arr.push({ m, l, id: l.id })));
  return arr;
}
function totalLessons(){ return COURSE.reduce((n, m) => n + m.lessons.length, 0); }
function doneCount(){ return state.completed.length; }
function findLesson(id){ return flatLessons().find(x => x.id === id) || null; }
function firstUncompleted(){
  const fl = flatLessons();
  return fl.find(x => !isDone(x.id)) || fl[0];
}

/* ---------- Редактор кода ---------- */
function replaceSel(ta, text){
  if (document.execCommand){
    document.execCommand('insertText', false, text);
  } else {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.setRangeText(text, s, e, 'end');
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }
}

function createEditor(rootEl, initialCode){
  const ta = $('.ed-text', rootEl);
  const pre = $('pre.hl', rootEl);
  const gutter = $('.gutter', rootEl);
  const ed = { onChange: null, onRun: null, onCheck: null };

  function render(){
    const v = ta.value;
    pre.innerHTML = '<code>' + highlightPython(v) + '\n</code>';
    const lines = v.split('\n').length;
    let g = '';
    for (let i = 1; i <= lines; i++) g += i + '\n';
    gutter.textContent = g;
    sync();
  }
  function sync(){
    pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
    gutter.scrollTop = ta.scrollTop;
  }
  ta.addEventListener('input', () => {
    render();
    if (ed.onChange) ed.onChange(ta.value);
  });
  ta.addEventListener('scroll', sync);

  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      if (ed.onCheck) ed.onCheck(); else if (ed.onRun) ed.onRun();
      return;
    }
    if (e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      if (!e.shiftKey){
        replaceSel(ta, '    ');
      } else {
        const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
        const line = ta.value.slice(ls, en);
        const cut = line.replace(/^ {1,4}/, '');
        if (line.length !== cut.length){
          ta.setSelectionRange(ls, en);
          replaceSel(ta, cut);
        }
      }
      render();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey){
      e.preventDefault();
      const s = ta.selectionStart;
      const ls = ta.value.lastIndexOf('\n', s - 1) + 1;
      const line = ta.value.slice(ls, s);
      const indent = (line.match(/^[ \t]*/) || [''])[0];
      const extra = /:\s*$/.test(line.trimEnd()) ? '    ' : '';
      replaceSel(ta, '\n' + indent + extra);
      render();
    }
  });

  ed.setValue = (v) => { ta.value = v; render(); };
  ed.getValue = () => ta.value;
  ed.focus = () => ta.focus();
  ed.setValue(initialCode || '');
  return ed;
}

<li><code>[abc]</code> — любой из символов a, b, c</li>
<li><code>+</code> — один и более, <code>*</code> — ноль и более</li>
<li><code>^</code> — начало строки, <code>$</code> — конец</li>
</ul>
<p>Главная функция: <code>re.findall(шаблон, текст)</code> возвращает список всех совпадений, <code>re.sub(шаблон, замена, текст)</code> заменяет совпадения.</p>

/* ================================================================
   Приложение: Pyodide, роутер, представления
================================================================ */
let pyodide = null;
let pyPromise = null;
let renderToken = 0;

function setPyStatus(cls, label){
  const el = $('#pyStatus');
  if (!el) return;
  el.className = 'py-status ' + cls;
  const lbl = $('.py-label', el);
  if (lbl) lbl.textContent = label;
}

function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
    document.head.appendChild(s);
  });
}

function ensurePyodide(){
  if (pyodide) return Promise.resolve(pyodide);
  if (pyPromise) return pyPromise;
  setPyStatus('loading', 'Python загружается…');
  pyPromise = (async () => {
    await loadScriptOnce(PYODIDE_URL + 'pyodide.js');
    pyodide = await loadPyodide({ indexURL: PYODIDE_URL });
    setPyStatus('ok', 'Python готов');
    return pyodide;
  })();
  pyPromise.catch(() => {
    setPyStatus('err', 'Нет сети');
    pyPromise = null;
  });
  return pyPromise;
}

async function runInPython(code, tests){
  const py = await ensurePyodide();
  py.globals.set('__pyc_user_code__', code);
  py.globals.set('__pyc_tests__', JSON.stringify(tests || []));
  await py.runPythonAsync(HARNESS_SRC);
  const raw = py.globals.get('__PYC_RESULT__');
  return JSON.parse(raw);
}

function pyErrMsg(e){
  if (String(e.message || e).indexOf('загрузить') !== -1){
    return 'Не удалось загрузить Python (Pyodide).\nПроверь подключение к интернету и попробуй ещё раз — код выполняется на настоящем интерпретаторе, загружаемом с CDN.';
  }
  return String(e.message || e);
}

/* ---------- Тост и конфетти ---------- */
let toastTimer = null;
function toast(msg){
  let t = $('.toast');
  if (!t){
    t = document.createElement('div');
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function confetti(){
  const colors = ['#3fdc85', '#ffd343', '#58a6ff', '#d2a8ff', '#ff7b72', '#ffa657'];
  const root = document.createElement('div');
  document.body.appendChild(root);
  for (let i = 0; i < 70; i++){
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.6) + 's';
    c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    root.appendChild(c);
  }
  setTimeout(() => root.remove(), 5000);
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

  const navHtml = `
    <div class="inst-nav">
      ${prev ? `<a class="btn btn-ghost" href="#/lesson/${prev.id}">← ${escapeHtml(prev.l.title)}</a>` : '<a class="btn btn-ghost" href="#/">← К программе</a>'}
      ${next
        ? `<button class="btn btn-primary" id="nextBtn">Далее →</button>`
        : `<a class="btn btn-primary" href="#/certificate">К сертификату 🎓</a>`}
    </div>
    ${doneNow ? `<div class="done-note">✓ Урок пройден</div>` : ''}`;

  const taskHtml = isChallenge && l.task ? `
    <div class="task-box">
      <h4>🎯 Задание</h4>
      ${l.task}
    </div>` : '';

  const consoleHead = `
    <div class="console-head">
      <button class="ctab active" data-pane="out">Вывод</button>
      ${isChallenge ? `<button class="ctab" data-pane="tests">Тесты <span class="cnt" id="testCnt">0/0</span></button>` : ''}
      <button class="console-clear" id="clearConsole">очистить</button>
    </div>`;

  app.innerHTML = `
  <div class="lesson" data-lid="${lid}">
    <div class="mobile-tabs">
      <button data-t="inst" class="active">📖 Инструкция</button>
      <button data-t="ed">💻 Редактор</button>
    </div>
    <div class="lesson-grid">
      <aside class="pane-inst">
        <div class="crumbs">
          <a class="crumb" href="#/">← Программа курса</a>
          <span class="chip">${m.icon} ${escapeHtml(m.title)}</span>
          <span class="l-badge"><span class="badge badge-${l.type}">${l.type === 'theory' ? 'теория' : 'практика'}</span></span>
        </div>
        <h1 class="lesson-title">${escapeHtml(l.title)}</h1>
        <div class="inst-body tb">
          ${l.theory}
          ${taskHtml}
          ${hintsHtml ? `<details class="hints"><summary>💡 Подсказки (${l.hints.length})</summary>${hintsHtml}</details>` : ''}
          ${solHtml}
        </div>
        ${navHtml}
      </aside>
      <section class="pane-editor">
        <div class="ed-toolbar">
          <span class="ed-file"><i></i>main.py</span>
          <div class="ed-actions">
            <button class="btn btn-run" id="runBtn">▶ Запустить</button>
            ${isChallenge ? `<button class="btn btn-check" id="checkBtn">✓ Проверить</button>` : ''}
            <button class="btn btn-reset" id="resetCode" title="Вернуть исходный код">↺</button>
          </div>
        </div>
        <div class="code-editor">
          <div class="gutter"></div>
          <div class="editor-wrap">
            <pre class="hl"><code></code></pre>
            <textarea class="ed-text" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off"></textarea>
          </div>
        </div>
        <div class="console">
          ${consoleHead}
          <div class="console-body">
            <div class="console-pane active" data-pane="out"><div class="placeholder">Нажми «Запустить», чтобы выполнить код на настоящем Python</div></div>
            ${isChallenge ? `<div class="console-pane" data-pane="tests"><div class="placeholder">Нажми «Проверить», чтобы прогнать тесты</div></div>` : ''}
          </div>
        </div>
      </section>
    </div>
  </div>`;

  /* --- подсветка примеров в теории --- */
  $$('.code-block code', app).forEach(c => {
    c.innerHTML = highlightPython(c.textContent);
  });

  /* --- редактор --- */
  const editor = createEditor($('.code-editor', app), code);
  let draftTimer = null;
  editor.onChange = (v) => {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => {
      state.drafts[lid] = v;
      saveState();
    }, 500);
  };

  /* --- консоль --- */
  const panes = {};
  $$('.console-pane', app).forEach(p => panes[p.dataset.pane] = p);
  const ctabBtns = $$('.ctab', app);
  function switchTab(name){
    ctabBtns.forEach(b => b.classList.toggle('active', b.dataset.pane === name));
    Object.keys(panes).forEach(k => panes[k].classList.toggle('active', k === name));
  }
  ctabBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.pane)));
  $('#clearConsole').addEventListener('click', () => {
    Object.values(panes).forEach(p => p.innerHTML = '<div class="placeholder">Очищено</div>');
    const cnt = $('#testCnt');
    if (cnt) cnt.textContent = '0/' + (l.tests ? l.tests.length : 0);
  });
  function setOut(html){ panes.out.innerHTML = html; }
  function setTests(html){
    panes.tests.innerHTML = html;
    const cnt = $('#testCnt');
    if (cnt && l.tests) cnt.textContent = passedCount + '/' + l.tests.length;
  }

  /* --- запуск --- */
  const runBtn = $('#runBtn');
  const checkBtn = $('#checkBtn');
  editor.onRun = null; editor.onCheck = null;
  runBtn.addEventListener('click', doRun);
  if (checkBtn) checkBtn.addEventListener('click', doCheck);

  async function doRun(){
    runBtn.disabled = true;
    const old = runBtn.textContent;
    runBtn.textContent = '⏳ Выполняю…';
    switchTab('out');
    try {
      const data = await runInPython(editor.getValue(), null);
      if (token !== renderToken) return;
      if (data.setup_error){
        setOut('<div class="err-line">' + escapeHtml(data.setup_error) + '</div>');
      } else if (data.stdout){
        setOut('<pre class="out">' + escapeHtml(data.stdout) + '</pre>');
      } else {
        setOut('<div class="placeholder">Программа выполнилась без вывода</div>');
      }
    } catch(e){
      if (token === renderToken) setOut('<div class="err-line">' + escapeHtml(pyErrMsg(e)) + '</div>');
    }
    runBtn.disabled = false;
    runBtn.textContent = old;
  }

  let passedCount = 0;
  async function doCheck(){
    checkBtn.disabled = true;
    const old = checkBtn.textContent;
    checkBtn.textContent = '⏳ Проверяю…';
    switchTab('tests');
    try {
      const data = await runInPython(editor.getValue(), l.tests);
      if (token !== renderToken) return;
      const results = data.results || [];
      passedCount = results.filter(r => r.ok).length;
      const rows = results.map(r => `
        <div class="test-row ${r.ok ? 'pass' : 'fail'}">
          <span class="t-icon">${r.ok ? '✅' : '❌'}</span>
          <span><span class="t-name">${escapeHtml(r.name)}</span>${r.msg ? `<span class="t-msg">${escapeHtml(r.msg)}</span>` : ''}</span>
        </div>`).join('');
      const allOk = results.length > 0 && passedCount === results.length;
      const banner = allOk ? `
        <div class="success-banner">🎉 Все тесты пройдены! ${isDone(lid) ? '' : 'Урок зачтён.'}
          ${next ? `<a href="#/lesson/${next.id}" style="color:var(--text);margin-left:8px">Следующий урок →</a>` : `<a href="#/certificate" style="color:var(--text);margin-left:8px">К сертификату →</a>`}
        </div>` : '';
      setTests(rows + banner);
      const cnt = $('#testCnt');
      if (cnt) cnt.textContent = passedCount + '/' + results.length;
      if (allOk && !isDone(lid)){
        markDone(lid);
        confetti();
        toast('Урок пройден! 🎉');
        const note = $('.done-note', app);
        if (!note){
          $('.inst-nav', app).insertAdjacentHTML('afterend', '<div class="done-note">✓ Урок пройден</div>');
        }
      }
    } catch(e){
      if (token === renderToken) setTests('<div class="err-line">' + escapeHtml(pyErrMsg(e)) + '</div>');
    }
    checkBtn.disabled = false;
    checkBtn.textContent = old;
  }
  editor.onCheck = isChallenge ? doCheck : doRun;

  /* --- сброс кода --- */
  $('#resetCode').addEventListener('click', () => {
    if (confirm('Вернуть исходный код урока? Твои изменения пропадут.')){
      editor.setValue(l.starter);
      delete state.drafts[lid];
      saveState();
      toast('Код сброшен к исходному');
    }
  });

  /* --- решение с подтверждением --- */
  const sol = $('details.sol', app);
  if (sol){
    const summary = $('summary', sol);
    summary.addEventListener('click', (e) => {
      if (!sol.open && !summary.dataset.armed){
        e.preventDefault();
        if (confirm('Показать готовое решение? Сначала попробуй справиться сам(а) и загляни в подсказки.')){
          summary.dataset.armed = '1';
          sol.open = true;
        }
      }
    });
    $('#insertSol').addEventListener('click', () => {
      editor.setValue(l.solution || '');
      state.drafts[lid] = l.solution || '';
      saveState();
      toast('Решение вставлено в редактор — запусти проверку');
    });
  }

  /* --- навигация --- */
  const nextBtn = $('#nextBtn');
  if (nextBtn){
    nextBtn.addEventListener('click', () => {
      if (l.type === 'theory') markDone(lid);
      location.hash = '#/lesson/' + next.id;
    });
  }

  /* --- мобильные табы --- */
  const lessonEl = $('.lesson', app);
  $$('.mobile-tabs button', app).forEach(b => {
    b.addEventListener('click', () => {
      $$('.mobile-tabs button', app).forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      lessonEl.classList.toggle('show-editor', b.dataset.t === 'ed');
    });
  });

  updateTopbar();
}

/* ---------- Сертификат ---------- */
function renderCertificate(){
  const token = ++renderToken;
  const app = $('#app');
  const total = totalLessons(), done = doneCount();
  const complete = done === total && total > 0;
  document.title = 'Сертификат — PyCamp';

  if (!complete){
    app.innerHTML = `
      <div class="cert-wrap">
        <div class="cert" style="opacity:.75">
          <div class="cert-lock">
            <div class="big-ico">🔒</div>
            <h2>Сертификат пока закрыт</h2>
            <p style="color:var(--muted)">Пройди все ${total} уроков, чтобы открыть его.</p>
            <div class="tp-bar" style="max-width:320px;margin:18px auto 6px"><div class="tp-fill" style="width:${total ? Math.round(done / total * 100) : 0}%"></div></div>
            <p style="color:var(--muted);font-size:13px">${done} из ${total} уроков</p>
            <div class="cert-actions"><a class="btn btn-primary" href="#/lesson/${firstUncompleted().id}">Продолжить обучение →</a></div>
          </div>
        </div>
      </div>`;
    return;
  }

  const dateStr = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  app.innerHTML = `
    <div class="cert-wrap">
      <div class="cert">
        <div class="cert-logo">🐍</div>
        <div class="cert-brand">PyCamp</div>
        <h2>Сертификат об окончании</h2>
        <p class="cert-sub">удостоверяет, что</p>
        <input class="cert-name" id="certName" placeholder="твоё имя" value="${escapeHtml(state.name || '')}" maxlength="60">
        <p class="cert-sub">успешно прошёл(ла) полный курс</p>
        <div class="cert-course">«Python с нуля: полный интерактивный курс»</div>
        <div class="cert-meta">
          ${COURSE.length} модулей · ${total} уроков · ${flatLessons().filter(x => x.l.type === 'challenge').length} практических задач с автопроверкой<br>
          от «Привет, мира» до классов, генераторов и собственных проектов
        </div>
        <div class="cert-date">Дата выдачи: ${dateStr}</div>
        <div class="cert-actions">
          <button class="btn btn-ghost" id="certConfetti">🎉 Отпраздновать</button>
          <a class="btn btn-primary" href="#/">Вернуться к программе</a>
        </div>
      </div>
    </div>`;

  const nameInput = $('#certName');
  nameInput.addEventListener('input', () => {
    state.name = nameInput.value;
    saveState();
  });
  $('#certConfetti').addEventListener('click', confetti);
  if (token === renderToken) confetti();
}

/* ---------- Роутер ---------- */
function route(){
  const h = location.hash || '#/';
  const mm = h.match(/^#\/lesson\/([\w-]+)$/);
  if (mm) renderLesson(mm[1]);
  else if (h === '#/certificate') renderCertificate();
  else renderHome();
  window.scrollTo(0, 0);
}

/* ---------- Старт ---------- */
updateTopbar();
window.addEventListener('hashchange', route);
route();

$('#resetAll').addEventListener('click', () => {
  if (confirm('Точно сбросить весь прогресс курса? Это действие нельзя отменить.')){
    state = { completed: [], drafts: {}, name: state.name };
    saveState();
    updateTopbar();
    route();
    toast('Прогресс сброшен');
  }
});

/* Фоновая предзагрузка Python, чтобы первый запуск был быстрым */
setTimeout(() => { ensurePyodide().catch(() => {}); }, 1500);

/* Скрытый QA-хук: прогоняет все эталонные решения через тесты */
window.__pycampQA = async function(){
  const out = [];
  for (const x of flatLessons()){
    if (x.l.type === 'challenge'){
      try {
        const data = await runInPython(x.l.solution, x.l.tests);
        const fails = (data.results || []).filter(r => !r.ok);
        out.push({ id: x.id, ok: fails.length === 0, fails: fails.map(f => f.name + ': ' + f.msg), err: data.setup_error || '' });
      } catch(e){
        out.push({ id: x.id, ok: false, fails: [], err: String(e.message || e) });
      }
    }
  }
  return out;
};
</script>
